<div class="relative min-h-screen w-full bg-[#070a11] flex items-center justify-center p-4 sm:p-6 overflow-hidden">
  
  <!-- Subtle Ambient Glow Backgrounds -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 translate-y-1/2 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Card Container -->
  <div class="relative z-10 w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-white/10 shadow-2xl rounded-3xl p-8 sm:p-10">
    
    <!-- Styled Header Section -->
    <div class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
        Create your <span class="bg-gradient-to-r from-cyan-400 via-sky-400 to-indigo-400 bg-clip-text text-transparent">GuzoGo</span> account
      </h1>
      <p class="text-slate-400 mt-2 text-sm sm:text-base">
        Connect with people around the world
      </p>
    </div>

    <!-- Success Message -->
    @if(successMessage()){
      <div class="mb-6 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 p-4 text-emerald-400 text-sm font-medium text-center">
        {{ successMessage() }}
      </div>
    }

    <!-- Error Message -->
    @if(errorMessage()){
      <div class="mb-6 rounded-2xl bg-red-500/10 border border-red-500/30 p-4 text-red-400 text-sm font-medium text-center">
        {{ errorMessage() }}
      </div>
    }

    <!-- Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <!-- Username -->
      <div>
        <input
          type="text"
          placeholder="Username"
          formControlName="userName"
          class="w-full rounded-xl bg-slate-950/80 border border-white/10 px-4 py-3.5 text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
        />
      </div>

      <!-- Email -->
      <div>
        <input
          type="email"
          placeholder="Email"
          formControlName="email"
          class="w-full rounded-xl bg-slate-950/80 border border-white/10 px-4 py-3.5 text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
        />
      </div>

      <!-- Password -->
      <div>
        <input
          type="password"
          placeholder="Password"
          formControlName="password"
          class="w-full rounded-xl bg-slate-950/80 border border-white/10 px-4 py-3.5 text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
        />
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full mt-2 rounded-xl py-3.5 font-semibold text-white bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:shadow-lg hover:shadow-cyan-500/20 hover:opacity-95 transition-all active:scale-[0.99] disabled:opacity-50 disabled:pointer-events-none flex items-center justify-center"
      >
        @if(isLoading()){
          <div class="flex items-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Creating account...</span>
          </div>
        } @else {
          <span>Register</span>
        }
      </button>
    </form>

    <!-- Footer link -->
    <div class="mt-8 text-center text-slate-400 text-sm">
      Already have an account?
      <a routerLink="/login" class="text-cyan-400 font-medium hover:underline ml-1">Sign in</a>
    </div>

  </div>
</div>
