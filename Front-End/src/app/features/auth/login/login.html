<div class="min-h-screen bg-[#070a11] flex items-center justify-center px-6">
  <div
    class="w-full max-w-md bg-slate-900/40 backdrop-blur-xl border border-white/10 shadow-2xl rounded-3xl p-8"
  >
    <h1 class="text-3xl font-bold text-white text-center mb-2">
      Welcome back to GuzoGo
    </h1>
    <p class="text-slate-400 text-center mb-8">
      Sign in to access your account
    </p>

    @if(errorMessage){
      <div
        class="mb-5 rounded-xl bg-red-400/10 border border-red-400/30 p-3 text-red-400"
      >
        {{errorMessage}}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <input
        type="email"
        placeholder="Email"
        formControlName="email"
        class="w-full mb-4 rounded-xl bg-slate-950/60 border border-white/10 px-4 py-3 text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400"
      />

      <!-- Password -->
      <input
        type="password"
        placeholder="Password"
        formControlName="password"
        class="w-full mb-6 rounded-xl bg-slate-950/60 border border-white/10 px-4 py-3 text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-400"
      />

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full rounded-xl py-3 font-semibold text-white bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-400 hover:opacity-90 transition disabled:opacity-50 flex items-center justify-center"
      >
        @if(isLoading){
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>

    <div class="mt-6 text-center text-slate-400 text-sm">
      Don't have an account?
      <a routerLink="/register" class="text-cyan-400 hover:underline ml-1">Register</a>
    </div>
  </div>
</div>
