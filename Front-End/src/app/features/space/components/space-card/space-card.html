<div class="bg-[#0b0e24] border border-[#1b2040] hover:border-indigo-500/50 rounded-2xl p-6 transition-all duration-200 shadow-lg flex flex-col justify-between">
  
  <div>
    <!-- Top Bar: Category Pill & Room Meta -->
    <div class="flex items-center justify-between mb-4">
      
      <!-- Dynamic Category Badge -->
      <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
        {{ categoryDisplayName }}
      </span>

      <!-- Privacy & Capacity -->
      <div class="flex items-center gap-2">
        <span 
          [class]="room.isPublic ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'"
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-medium border">
          <span>{{ room.isPublic ? '🌐 Public' : '🔒 Password' }}</span>
        </span>

        <span class="text-xs font-semibold text-slate-400 bg-slate-800/60 px-2.5 py-1 rounded-lg border border-slate-700/50 flex items-center gap-1">
          👥 {{ room.participantsCount || room.participants || 1 }}/{{ room.maxParticipants || 6 }}
        </span>
      </div>

    </div>

    <!-- Room Title -->
    <h3 class="text-xl font-bold text-white mb-4 line-clamp-2">
      <span *ngIf="!room.isPublic" class="mr-1">🔒</span>
      {{ room.title }}
    </h3>
  </div>

  <!-- Bottom Bar: Dynamic Participants & Host -->
  <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
    
    <div class="flex items-center gap-3">
      <!-- Dynamic Avatars (Only shows 1 avatar if 1 user, 2 if 2 users, max 3) -->
      <div class="flex -space-x-2 overflow-hidden">
        <img 
          *ngFor="let avatar of dynamicAvatars" 
          [src]="avatar" 
          alt="Participant Avatar" 
          class="inline-block h-8 w-8 rounded-full ring-2 ring-[#0b0e24] object-cover" 
        />
      </div>

      <!-- Host Name -->
      <span class="text-sm font-medium text-slate-300">
        Host: <strong class="text-white font-semibold">{{ hostDisplayName }}</strong>
      </span>
    </div>

    <!-- Join Button -->
    <!-- Inside space-card.component.html -->
    <button 
      (click)="handleJoin()"
      [class]="room.isPublic ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-amber-600 hover:bg-amber-500'"
      class="px-5 py-2.5 rounded-xl font-semibold text-sm text-white transition shadow-md active:scale-95 flex items-center gap-1.5 cursor-pointer">
      <span>{{ room.isPublic ? 'Join Group' : '🔑 Join Group' }}</span>
    </button>

  </div>

</div>
