<div class="bg-[#0b0e24] border border-[#1b2040] hover:border-indigo-500/50 rounded-2xl p-6 transition-all duration-200 shadow-lg flex flex-col justify-between">
  
  <div>
    <!-- Top Bar: Category Pill & Room Meta -->
    <div class="flex items-center justify-between mb-4">
      
      <!-- Dynamic Category Badge -->
      <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
        {{ categoryDisplayName }}
      </span>

      <!-- Privacy & Capacity -->
      <div class="flex items-center gap-2">
        <span 
          [class]="room.isPublic ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'"
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-medium border">
          <span>{{ room.isPublic ? '🌐 Public' : '🔒 Password' }}</span>
        </span>

        <span class="text-xs font-semibold text-slate-400 bg-slate-800/60 px-2.5 py-1 rounded-lg border border-slate-700/50 flex items-center gap-1">
          👥 {{ participantCount }}/{{ room.maxParticipants || 6 }}
        </span>
      </div>

    </div>

    <!-- Room Title -->
    <h3 class="text-xl font-bold text-white mb-4 line-clamp-2">
      <span *ngIf="!room.isPublic" class="mr-1">🔒</span>
      {{ room.title }}
    </h3>
  </div>

  <!-- Bottom Bar: Dynamic Participants & Host -->
  <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
    
    <div class="flex items-center gap-3">
      <div class="flex -space-x-2 overflow-hidden">
        <img 
          *ngFor="let avatar of dynamicAvatars" 
          [src]="avatar" 
          alt="Participant Avatar" 
          class="inline-block h-8 w-8 rounded-full ring-2 ring-[#0b0e24] object-cover" 
        />
      </div>

      <span class="text-sm font-medium text-slate-300">
        Host: <strong class="text-white font-semibold">{{ hostDisplayName }}</strong>
      </span>
    </div>

    <!-- Join Button -->
    <button 
      type="button"
      (click)="handleJoin(); $event.stopPropagation(); $event.preventDefault()"
      [class]="room.isPublic ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-amber-600 hover:bg-amber-500'"
      class="px-5 py-2.5 rounded-xl font-semibold text-sm text-white transition shadow-md active:scale-95 flex items-center gap-1.5 cursor-pointer">
      <span>{{ room.isPublic ? 'Join Group' : '🔑 Join Group' }}</span>
    </button>

  </div>

</div>


<!-- Password Modal Overlay -->
<ng-container *ngIf="showPasswordModal">
  <div class="fixed inset-0 z-50 flex items-center justify-center" style="background-color: rgba(0,0,0,0.7);">
    <div class="bg-[#0f132a] border border-[#2a305e] rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl">
      
      <div class="text-center mb-5">
        <div class="text-4xl mb-3">🔒</div>
        <h3 class="text-lg font-bold text-white">{{ room.title }}</h3>
        <p class="text-sm text-slate-400 mt-1">This room is password protected</p>
      </div>

      <div class="mb-4">
        <input
          type="password"
          [(ngModel)]="passwordInput"
          (keydown)="onPasswordKeydown($event)"
          placeholder="Enter room password"
          autocomplete="new-password"
          name="roomPass"
          class="w-full bg-[#0b0e24] border border-[#1b2040] text-white text-sm px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500 placeholder-slate-500 transition"
        />
        <p *ngIf="passwordError" class="text-rose-400 text-xs mt-2 flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          {{ passwordError }}
        </p>
      </div>

      <div class="flex gap-3">
        <button 
          type="button"
          (click)="closePasswordModal()"
          class="flex-1 px-4 py-2.5 rounded-xl text-sm font-medium text-slate-300 bg-slate-800/60 border border-slate-700 hover:bg-slate-700 transition cursor-pointer">
          Cancel
        </button>
        <button 
          type="button"
          (click)="submitPassword()"
          [disabled]="isJoining"
          class="flex-1 px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-amber-600 hover:bg-amber-500 transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
          <span *ngIf="!isJoining">🔑 Join</span>
          <span *ngIf="isJoining" class="flex items-center justify-center gap-2">
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Joining...
          </span>
        </button>
      </div>
    </div>
  </div>
</ng-container>
